name: Deploy to Azure Static Web Apps

# Deploys the built SPA plus the two managed Functions in api/.
#
# Requires one repository secret, AZURE_STATIC_WEB_APPS_API_TOKEN — the
# deployment token from the Static Web App's "Manage deployment token" panel,
# or from `./infra/deploy.sh`. It is scoped to that one resource, so it cannot
# touch anything else in the subscription.
#
# Until that secret exists the deploy step skips with an explanatory message
# rather than failing, so the build checks stay meaningful on their own.
#
# Azure AI credentials are NOT set here. They belong in the Static Web App's
# Application Settings, so the key never passes through the repository.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: swa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npx oxlint
      - run: npm run build

      # The Functions bundles are exercised without the Functions host, which
      # catches adapter regressions a plain typecheck cannot.
      - run: npm run build:api
      - run: npm run verify:api

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify
    if: github.event.action != 'closed'
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Report missing deployment token
        if: env.SWA_TOKEN == ''
        run: |
          echo "::notice::AZURE_STATIC_WEB_APPS_API_TOKEN is not set, so deployment was skipped."
          echo "Run ./infra/deploy.sh to provision the Static Web App, then store the"
          echo "token it prints as a repository secret to enable this step."

      - uses: actions/checkout@v4
        if: env.SWA_TOKEN != ''

      - name: Build and deploy
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: dist

  close_preview:
    name: Tear down preview
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Close staging environment
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
